<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write Comment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.12);
            --glass-header: rgba(15, 23, 42, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Header */
        .top-bar {
            width: 100%;
            background: var(--glass-header);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .avatar-link {
            text-decoration: none;
            margin-right: 0.85rem;
            flex-shrink: 0;
        }

        .avatar-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            user-select: none;
        }

        .user-info-text {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .user-name-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-id-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 0.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Container */
        .content {
            flex: 1;
            padding: 1.5rem 1rem;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Glassmorphism Card */
        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 1.75rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
        }

        /* Card Header */
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-2px);
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .card-title {
            font-size: 1.25rem;
            color: var(--text-primary);
            font-weight: 700;
            text-align: center;
            flex: 1;
            margin-right: 40px; /* Aligns title center relative to back button */
        }

        /* Form Styling */
        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .comment-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .comment-textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--input-border);
            border-radius: 14px;
            font-size: 0.95rem;
            color: var(--text-primary);
            background-color: var(--input-bg);
            resize: vertical;
            min-height: 140px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .comment-textarea::placeholder {
            color: #64748b;
        }

        .comment-textarea:focus {
            border-color: var(--accent-blue);
            background-color: rgba(15, 23, 42, 0.85);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 0.9rem 1.5rem;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-blue-hover) 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .top-bar {
                padding: 0.75rem 1rem;
            }
            .content {
                padding: 1rem;
            }
            .profile-card {
                padding: 1.25rem;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <header class="top-bar">
        <a class="avatar-link" title="Home">
            <div class="avatar-circle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
        </a>

        <div class="user-info-text">
            <h1 class="user-name-title">Name: {{.Name}}</h1>
            <h1 class="user-id-title">ID: {{.ID}}</h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="content">
        <div class="profile-card">
            
            <!-- Card Header -->
            <div class="card-header">
                <a href="javascript:history.back()" class="back-btn" title="Go Back">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </a>
                <h2 class="card-title">Write Comment</h2>
            </div>

            <!-- Form -->
            <form action="/comment_action" method="POST" class="comment-form">
                <label for="comment" class="comment-label">Your Comment</label>

                <textarea 
                    id="comment" 
                    name="comment_text_input" 
                    rows="5" 
                    class="comment-textarea" 
                    placeholder="Share your thoughts..." 
                    required></textarea>

                <button type="submit" class="submit-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    Submit Comment
                </button>
            </form>

        </div>
    </main>

</body>
</html>
