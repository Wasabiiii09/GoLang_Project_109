<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.8);
            --card-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(255, 255, 255, 0.9) inset;
            
            --primary: #3b82f6;
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            --primary-shadow: 0 8px 20px -4px rgba(59, 130, 246, 0.4);
            
            --danger-bg: #fff1f2;
            --danger-text: #e11d48;
            --danger-border: #fecdd3;
            --danger-gradient: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
            --danger-shadow: 0 8px 20px -4px rgba(225, 29, 72, 0.35);

            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-full: 9999px;
            
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.75rem 1.25rem;
            box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.03);
        }

        .header-container {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .avatar-link {
            text-decoration: none;
            display: inline-block;
            position: relative;
        }

        .avatar-circle {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-full);
            background: var(--primary-gradient);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--primary-shadow);
            transition: var(--transition);
        }

        .avatar-link:hover .avatar-circle {
            transform: scale(1.06) rotate(-3deg);
        }

        .user-info-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .user-name-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .user-id-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-top: 2px;
        }

        .content {
            flex: 1;
            padding: 1.5rem 1rem 2.5rem;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .profile-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--card-shadow);
            padding: 2rem 1.75rem;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Subtle decorative ambient lighting behind card */
        .profile-card::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 1.75rem;
            position: relative;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            background: #ffffff;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
            transition: var(--transition);
            flex-shrink: 0;
        }

        .back-btn:hover {
            background: var(--primary-gradient);
            color: #ffffff;
            border-color: transparent;
            transform: translateX(-3px);
            box-shadow: var(--primary-shadow);
        }

        .back-btn:active {
            transform: translateX(-1px) scale(0.96);
        }

        .card-title {
            font-size: 1.25rem;
            color: var(--text-primary);
            font-weight: 800;
            text-align: center;
            flex: 1;
            margin-right: 40px;
            letter-spacing: -0.01em;
        }

        .info-group {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: var(--radius-lg);
            padding: 1rem 1.15rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            transition: var(--transition);
        }

        .info-group:hover {
            background: #ffffff;
            border-color: rgba(59, 130, 246, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px -3px rgba(0, 0, 0, 0.04);
        }

        .info-icon-wrapper {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-md);
            background: #f1f5f9;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .info-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
        }

        .info-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 0.15rem;
        }

        .info-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            word-break: break-word;
        }

        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            margin-top: 1.75rem;
        }

        .actions-group form {
            width: 100%;
        }

        .btn {
            width: 100%;
            padding: 0.9rem 1.25rem;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: var(--transition);
            text-decoration: none;
            letter-spacing: 0.01em;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: #ffffff;
            box-shadow: var(--primary-shadow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -6px rgba(59, 130, 246, 0.5);
            filter: brightness(1.05);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid var(--danger-border);
        }

        .btn-danger:hover {
            background: var(--danger-gradient);
            color: #ffffff;
            border-color: transparent;
            box-shadow: var(--danger-shadow);
            transform: translateY(-2px);
        }

        .btn-danger:active {
            transform: translateY(0);
        }

        /* SVG Global Vector Formatting */
        .icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
        }

        @media (min-width: 640px) {
            .content {
                padding: 3.5rem 1rem;
            }
            .profile-card {
                padding: 2.5rem 2.25rem;
            }
            .card-title {
                font-size: 1.35rem;
            }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="header-container">
            <a class="avatar-link" href="/" title="Go to Home">
                <div class="avatar-circle">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
            </a>

            <div class="user-info-text">
                <div class="user-name-title">{{.Name}}</div>
                <div class="user-id-title">ID: {{.ID}}</div>
            </div>
        </div>
    </header>

    <main class="content">
        <div class="profile-card">
            
            <div class="card-header">
                <a href="/" class="back-btn" title="Back">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </a>
                <h2 class="card-title">Profile Details</h2>
            </div>

            <div class="info-group">
                <div class="info-icon-wrapper">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <div class="info-content">
                    <div class="info-label">Full Name</div>
                    <div class="info-value">{{.Name}}</div>
                </div>
            </div>

            <div class="info-group">
                <div class="info-icon-wrapper">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM17 8H7v2h10V8zm0 4H7v2h10v-2zm-4 4H7v2h6v-2z"/></svg>
                </div>
                <div class="info-content">
                    <div class="info-label">User ID</div>
                    <div class="info-value">{{.ID}}</div>
                </div>
            </div>

            <div class="actions-group">
                <form action="/comment" method="GET">
                    <button type="submit" class="btn btn-primary">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                        Add Comment
                    </button>
                </form>

                <form action="/log_out" method="POST">
                    <button type="submit" class="btn btn-danger">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                        Log Out
                    </button>
                </form>
            </div>

        </div>
    </main>

</body>
</html>
