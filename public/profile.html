<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            
            --danger: #f43f5e;
            --danger-hover: #e11d48;
            --danger-bg: rgba(244, 63, 94, 0.1);

            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-sub: #cbd5e1;
            
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            
            --transition: all 0.2s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Bar: Name & ID NUR HIER oben */
        .top-bar {
            width: 100%;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.75rem 1.5rem;
        }

        .header-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .avatar-link {
            text-decoration: none;
        }

        .avatar-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #334155;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--card-border);
            transition: var(--transition);
        }

        .avatar-link:hover .avatar-circle {
            background: var(--primary);
            color: #0f172a;
        }

        .user-info-text {
            display: flex;
            flex-direction: column;
        }

        .user-name-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }

        .user-id-title {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 600;
            margin-top: 2px;
        }

        /* Hauptbereich */
        .content {
            flex: 1;
            padding: 2rem 1rem;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 1.75rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            background: #0f172a;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 1px solid var(--card-border);
            transition: var(--transition);
        }

        .back-btn:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .card-title {
            font-size: 1.25rem;
            color: var(--text-main);
            font-weight: 700;
        }

        /* Kommentare Bereich */
        .comments-section {
            margin-bottom: 1.75rem;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .comment-count-badge {
            font-size: 0.75rem;
            background: #0f172a;
            color: var(--text-muted);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            border: 1px solid var(--card-border);
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .comment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 1.1rem;
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            transition: var(--transition);
        }

        .comment-item:hover {
            border-color: #475569;
        }

        .comment-text {
            font-size: 0.92rem;
            color: var(--text-sub);
            line-height: 1.4;
            word-break: break-word;
            flex: 1;
        }

        .btn-delete {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 0.4rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .btn-delete:hover {
            color: var(--danger);
            background: var(--danger-bg);
        }

        .empty-comments {
            padding: 2.5rem 1rem;
            text-align: center;
            background: #0f172a;
            border: 1px dashed var(--card-border);
            border-radius: var(--radius-md);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Aktions-Buttons */
        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--card-border);
        }

        .actions-group form {
            width: 100%;
        }

        .btn {
            width: 100%;
            padding: 0.85rem 1rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #0f172a;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            color: #ffffff;
        }

        .btn-danger-outline {
            background: transparent;
            color: var(--danger);
            border: 1px solid rgba(244, 63, 94, 0.4);
        }

        .btn-danger-outline:hover {
            background: var(--danger);
            color: #ffffff;
            border-color: var(--danger);
        }

        .icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- OBERE LEISTE: Nur hier stehen Name & ID -->
    <header class="top-bar">
        <div class="header-container">
            <a class="avatar-link" href="/" title="Go to Home">
                <div class="avatar-circle">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
            </a>

            <div class="user-info-text">
                <div class="user-name-title">{{.User.Name}}</div>
                <div class="user-id-title">ID: {{.User.ID}}</div>
            </div>
        </div>
    </header>

    <main class="content">
        <div class="profile-card">
            
            <div class="card-header">
                <a href="/" class="back-btn" title="Back">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </a>
                <h2 class="card-title">Meine Kommentare</h2>
            </div>

            <!-- Liste der geschriebenen Kommentare -->
            <div class="comments-section">
                <div class="section-title">
                    <span>Verfasste Beiträge</span>
                    <span class="comment-count-badge">{{len .Comments}} / 5</span>
                </div>

                {{if .Comments}}
                    <div class="comments-list">
                        {{range .Comments}}
                            <div class="comment-item">
                                <p class="comment-text">{{.Text}}</p>
                                <form action="/delete_comment" method="POST">
                                    <input type="hidden" name="comment_id" value="{{.ID}}">
                                    <button type="submit" class="btn-delete" title="Kommentar löschen">
                                        <svg class="icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                                    </button>
                                </form>
                            </div>
                        {{end}}
                    </div>
                {{else}}
                    <div class="empty-comments">
                        Du hast noch keine Kommentare verfasst.
                    </div>
                {{end}}
            </div>

            <!-- Aktions-Buttons -->
            <div class="actions-group">
                <!-- Button führt zur comment.html Seite -->
                <form action="/comment/" method="GET">
                    <button type="submit" class="btn btn-primary">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                        Neuen Kommentar schreiben
                    </button>
                </form>

                <!-- Button zum Verlassen / Logout -->
                <form action="/log_out" method="POST">
                    <button type="submit" class="btn btn-danger-outline">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                        Account verlassen (Abmelden)
                    </button>
                </form>
            </div>

        </div>
    </main>

</body>
</html>
